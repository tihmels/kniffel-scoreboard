<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve, which
         the sticky bottom bar relies on to clear the iPhone home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f7f6f3"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#121318"
    />
    <meta
      name="description"
      content="Kniffel-Spielblock für unterwegs — Punkte eintragen, Bonus im Blick."
    />
    <meta name="apple-mobile-web-app-title" content="Kniffel" />
    <title>Kniffel Scoreboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
